name: FossWallet Widget Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Fix Android 37 SDK path
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi

      # Stable signature across all future Actions builds. Never commit the
      # debug.keystore file: it is restored from a GitHub Actions secret.
      - name: Restore persistent debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.FOSSWALLET_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${DEBUG_KEYSTORE_B64:-}" ]]; then
            echo "::error::Repository secret FOSSWALLET_DEBUG_KEYSTORE_B64 is missing."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null

      - name: Compile debug APK
        env:
          FOSSWALLET_WIDGET_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signing key
        shell: bash
        run: |
          set -euo pipefail

          STORE="$HOME/.android/debug.keystore"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"

          echo "Checking required files..."
          test -s "$STORE"
          test -s "$APK"
          test -x "$APKSIGNER"

          echo "Reading keystore certificate..."
          keytool -exportcert \
            -keystore "$STORE" \
            -storepass android \
            -alias androiddebugkey \
            -file "$RUNNER_TEMP/key.der"

          KEY_SHA=$(sha256sum "$RUNNER_TEMP/key.der" | cut -d' ' -f1)

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee "$RUNNER_TEMP/apk-certs.txt"

          APK_SHA=$(sed -nE \
            's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64}).*/\1/p' \
            "$RUNNER_TEMP/apk-certs.txt" | head -n1)

          if [[ -z "$APK_SHA" ]]; then
            echo "::error::Could not extract APK certificate digest"
            exit 1
          fi

          echo "Keystore SHA256: $KEY_SHA"
          echo "APK SHA256:      $APK_SHA"

          if [[ "${KEY_SHA,,}" != "${APK_SHA,,}" ]]; then
            echo "::error::Signing certificates do not match"
            exit 1
          fi

          echo "SIGNATURE VERIFIED SUCCESSFULLY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FossWallet-Widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
