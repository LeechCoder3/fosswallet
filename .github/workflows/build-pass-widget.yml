name: FossWallet Widget Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Fix Android 37 SDK path
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi

      # Stable signature across all future Actions builds. Never commit the
      # debug.keystore file: it is restored from a GitHub Actions secret.
      - name: Restore persistent debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.FOSSWALLET_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${DEBUG_KEYSTORE_B64:-}" ]]; then
            echo "::error::Repository secret FOSSWALLET_DEBUG_KEYSTORE_B64 is missing."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null

      - name: Compile debug APK
        env:
          FOSSWALLET_WIDGET_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FossWallet-Widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
       
      - name: Verify APK signing key
        shell: bash
        run: |
          set -euo pipefail

          KEY_SHA=$(keytool -exportcert \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sha256sum | cut -d' ' -f1)

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -type f \
            -print -quit)

          test -n "$APK"

          APK_SHA=$("$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" \
            verify --print-certs "$APK" \
            | awk -F': ' \
            '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')

          test -n "$APK_SHA"

          echo "Key certificate SHA-256: $KEY_SHA"
          echo "APK certificate SHA-256: $APK_SHA"

          if [[ "$KEY_SHA" != "${APK_SHA,,}" ]]; then
            echo "::error::APK signing key mismatch!"
            exit 1
          fi

          echo "SIGNATURE VERIFIED: APK matches GitHub secret."

