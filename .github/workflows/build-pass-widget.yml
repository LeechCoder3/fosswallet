name: FossWallet Widget Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Fix Android 37 SDK path
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi

      - name: Compile debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FossWallet-Widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-fo
          und: error
